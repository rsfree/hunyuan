# yuanbao-service :80 入口 —— 除 ACME 验证外一律跳 HTTPS
server {
    listen 80;
    server_name yuanbao.example.com;

    access_log /www/wwwlogs/yuanbao.example.com.log;
    error_log  /www/wwwlogs/yuanbao.example.com.error.log;

    # ACME HTTP-01：必须 ^~ 且排在 location / 之前
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / { return 301 https://$host$request_uri; }
}
