services:
  yuanbao-proxy:
    build: .
    container_name: yuanbao-proxy
    restart: unless-stopped
    shm_size: 1g
    ports:
      - "127.0.0.1:39177:39177"        # 只绑回环，公网入口走 nginx
    volumes:
      - ./auths/cookie.txt:/auths/cookie.txt:ro
      - ./auths/chrome-profile:/data/chrome-profile   # 持久化浏览器 profile（登录态）
    environment:
      YUANBAO_API_KEY: "${YUANBAO_API_KEY}"
      YB_MINT_BACKEND: "cdp"
      YB_DATA_PLANE: "cookie"
      CDP_HTTP: "http://127.0.0.1:9222"   # 同容器 loopback（多 worker 共享）
      YB_WORKERS: "4"
      YB_INSTANCE_NAME: "yuanbao-acc01"
      YB_BASE_URL: "https://yuanbao.1task.cn"
      YB_POOL_PEERS: "acc01=https://yuanbao.1task.cn"   # 号池总览数据源（加账号时在此追加 name=url）
      # === 代理池（凭据只放 .env，绝不入库）===
      # 数据面（聊天/生图出站）逐请求轮换出口 IP —— 2088 = 池的"每请求换 IP"端口
      YB_PROXY_POOL: "${YB_PROXY_POOL:-}"
      # 浏览器侧（铸签/扫码/接码登录）：经本地 socks 桥走 2089（域名哈希恒定出口，更像真人会话）
      YB_BROWSER_PROXY: "${YB_BROWSER_PROXY:-}"
