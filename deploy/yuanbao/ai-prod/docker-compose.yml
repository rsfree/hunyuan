services:
  yuanbao-proxy:
    build: .
    image: yuanbao-proxy:latest      # 多账号时各实例共享同一镜像（build 一次，运行 N 份）
    container_name: yuanbao-${YB_INSTANCE_NAME:-acc01}
    restart: unless-stopped
    # 🔴 给足优雅关闭时间：entrypoint 收到 SIGTERM 后先停 API，再让 chromium 收尾把
    #    cookie/localStorage flush 到 profile。时间太短会被 SIGKILL ⇒ 掉登录态。
    stop_grace_period: 30s
    shm_size: 1g
    ports:
      - "127.0.0.1:${YB_PORT:-39177}:39177"   # 只绑回环，公网入口走 nginx
    volumes:
      # 每实例独立 profile（= 一个账号）；多账号时改 YB_AUTH_DIR 指向各自目录
      - ./auths/${YB_INSTANCE_NAME:-acc01}/cookie.txt:/auths/cookie.txt:ro
      - ./auths/${YB_INSTANCE_NAME:-acc01}/chrome-profile:/data/chrome-profile
      # 调用统计：JSONL 明细 + 内存聚合（落在账号自己的目录里，跟着账号走）
      - ./auths/${YB_INSTANCE_NAME:-acc01}/stats:/data/stats
      # 号池账号状态（启用/禁用/隔离/剔除），跟着账号走
      - ./auths/${YB_INSTANCE_NAME:-acc01}/state:/data/state
      # 号池共享注册表：加号只需写这个文件，各实例按 mtime 热重载，**无需重启**
      - ../pool.json:/data/pool.json:ro
      # 自动加号的"意向文件"通道：页面只写请求，特权动作由宿主机 pool-provisioner 执行
      - ../requests:/data/requests
      # C 方案「分组共享」：组内 cookie 账号库（账号只存 cookie，不再各养一个浏览器）
      - ./auths/${YB_INSTANCE_NAME:-acc01}/accounts:/data/accounts
      - ../results:/data/results:ro
    environment:
      YUANBAO_API_KEY: "${YUANBAO_API_KEY}"
      # 号池内部只读 key（各实例共享）：让任一实例都能查到整池状态；不能当 API key 用
      YB_FLEET_KEY: "${YB_FLEET_KEY:-}"
      # 保活：定时用 cookie 探活 GET /api/info/general（0=关闭）。默认 15 分钟
      YB_KEEPALIVE_SEC: "${YB_KEEPALIVE_SEC:-900}"
      # 调用统计保留天数（明细 JSONL 自动清理）
      YB_STATS_KEEP_DAYS: "${YB_STATS_KEEP_DAYS:-30}"
      # 新号登录后自动开启「无水印保存」
      YB_AUTO_WATERMARK: "${YB_AUTO_WATERMARK:-1}"
      # 号池生命周期自动规则 + 轮询入口
      YB_AUTO_DISABLE_AFTER: "${YB_AUTO_DISABLE_AFTER:-3}"
      # 默认 1：一次成功保活即回池（设 3 配合 15 分钟周期＝要等 45 分钟，新号会"迟迟不进号池"）
      YB_AUTO_REENABLE_AFTER: "${YB_AUTO_REENABLE_AFTER:-1}"
      YB_AUTO_EJECT_AFTER_DAYS: "${YB_AUTO_EJECT_AFTER_DAYS:-0}"
      YB_ROUTER: "${YB_ROUTER:-1}"
      # 设备指纹种子：**默认留空**，各实例自然生成各自的设备身份（避免多号共用同一指纹被关联）
      YB_DEVICE_SEED: "${YB_DEVICE_SEED:-}"
      # 构建版本（update-service.sh 注入 git describe），可用 /admin/version 核对线上版本
      YB_BUILD_VERSION: "${YB_BUILD_VERSION:-unknown}"
      YB_MINT_BACKEND: "cdp"
      YB_DATA_PLANE: "${YB_DATA_PLANE:-page}"   # page=用容器自带登录态（扫码登录后免 cookie）；cookie=出站HTTP+文件cookie
      CDP_HTTP: "http://127.0.0.1:9222"   # 同容器 loopback
      # 🔴 页面数据面必须单 worker：每个 uvicorn worker 进程各自持有一个 CDP 页 +
      #    进程内锁（_bsk_lock 不跨进程）⇒ 多 worker = 多个重复标签页 + 无互斥（截图/会话错乱）
      YB_WORKERS: "${YB_WORKERS:-1}"
      YB_INSTANCE_NAME: "${YB_INSTANCE_NAME:-acc01}"
      # ⚠️ 不要给默认域名：多实例共用一个默认值会让自身识别出错（见代码注释）
      YB_BASE_URL: "${YB_BASE_URL:-}"
      # 号池总览数据源：把**所有**实例列进来（含自己），任一实例都能看到整池
      YB_POOL_PEERS: "${YB_POOL_PEERS:-acc01=https://yuanbao.example.com}"
      # === 代理池（凭据只放 .env，绝不入库）===
      # 🔴 推荐形态：**固定单出口**（一号一个固定 IP），而不是"每请求换 IP"的池。
      #   原因：同一 cookie 一分钟内跨 N 个 IP 是强异常特征（实测会先掉登录、再升级成封号）。
      #   配法（set-egress.sh 自动完成）：YB_PROXY_URL == YB_BROWSER_PROXY == 本号专属粘性代理，
      #   且 YB_PROXY_POOL **留空**（留空才会用 YB_PROXY_URL）。
      YB_PROXY_URL: "${YB_PROXY_URL:-}"
      # 池模式（逐请求轮换出口）：仅在需要一个号扛量时用；一号一 IP 场景请留空
      YB_PROXY_POOL: "${YB_PROXY_POOL:-}"
      # 浏览器侧（铸签/扫码/接码登录）：经本地 socks 桥走出去；
      # 与 YB_PROXY_URL 同值时 = 登录 IP == 使用 IP
      YB_BROWSER_PROXY: "${YB_BROWSER_PROXY:-}"
      # === 节奏与配额的护栏（降低封号概率）===
      # 同凭证两请求最小间隔 + 0~N 秒随机抖动（固定等距最像脚本）
      YB_MIN_INTERVAL: "${YB_MIN_INTERVAL:-2}"
      YB_MIN_JITTER: "${YB_MIN_JITTER:-1.5}"
      # 每凭证同时在途请求上限（间隔管发车节奏，这个管"同时几个在路上"）
      YB_ACCT_CONCURRENCY: "${YB_ACCT_CONCURRENCY:-5}"
      # 养号期：本实例首次保活成功后的 N 天内**禁止生图**（0=关闭）。建议 3
      YB_WARMUP_DAYS: "${YB_WARMUP_DAYS:-0}"
      # 每实例每天最多 N 次生成类调用（0=不限）。建议 60
      YB_DAILY_QUOTA: "${YB_DAILY_QUOTA:-0}"
      # === 时间维度的节律（2026-10-22 加，按线上 121 次生图日志复盘）===
      # 🔴 容器默认是 UTC：不设 TZ 时下面所有"按小时"的策略都按 UTC 算，北京时间会整体错 8 小时。
      # 用 POSIX 时区串 `CST-8` 而不是 `Asia/Shanghai`：镜像里没装 tzdata，
      # 写 Asia/Shanghai 会被 glibc 静默忽略并退回 UTC（实测 date 仍显示 UTC，只是时区名变成 "Asia"）
      TZ: "${TZ:-CST-8}"
      # 活跃时间窗（本地时区，左闭右开）。窗口外只降速不拒绝（凌晨还在稳定出图最扎眼）
      YB_ACTIVE_HOURS: "${YB_ACTIVE_HOURS:-7-24}"
      YB_OFFHOURS_SLOW: "${YB_OFFHOURS_SLOW:-3}"
      # slow=窗口外只降速；block=窗口外直接拒绝生图
      YB_OFFHOURS_MODE: "${YB_OFFHOURS_MODE:-slow}"
      # 生图单独一道更窄的并发闸：人类一次只生成一张，同瞬 5 张是最明显的脚本特征
      YB_IMAGE_CONCURRENCY: "${YB_IMAGE_CONCURRENCY:-2}"
      # 生图结束后的"看结果"停顿区间（秒），0=关
      YB_IMAGE_COOL: "${YB_IMAGE_COOL:-4-10}"
      # 连续失败的指数退避基数/上限（秒），0=关
      YB_FAIL_BACKOFF: "${YB_FAIL_BACKOFF:-2}"
      YB_FAIL_BACKOFF_CAP: "${YB_FAIL_BACKOFF_CAP:-60}"
      # 每 N 次生图插一次只读浏览请求（行为穿插，0=关）
      YB_BROWSE_EVERY: "${YB_BROWSE_EVERY:-10}"
    # 实例间互通（号池聚合 / 批量运维 / 跨实例代理）走这个共享网络，用容器名寻址
    networks:
      - yuanbao-net

networks:
  yuanbao-net:
    external: true
    name: yuanbao-net
