# yuanbao-service HTTPS 入口（acme.sh HTTP-01 证书，自动续期）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yuanbao.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/yuanbao.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/yuanbao.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/yuanbao.1task.cn.log;
    error_log  /www/wwwlogs/yuanbao.1task.cn.error.log;

    auth_basic off;   # 显式声明：鉴权在服务侧 YUANBAO_API_KEY

    location / { include /www/server/panel/vhost/nginx/yuanbao-proxy.inc; }
}
